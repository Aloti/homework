name: Check Scripts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-scripts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run script exercise
        shell: bash
        run: bash task-1-script/random-data.sh
        working-directory: ./junior

      - name: Run configuration exercise
        shell: bash
        run: bash task-2-configuration/show-service.sh
        working-directory: ./junior